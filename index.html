<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富木 → 関空 時刻表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      padding: 14px 20px;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }

    .clock {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #f1f5f9;
    }

    .header-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* 出勤時刻設定 */
    .setting-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .setting-card label {
      font-size: 13px;
      color: #94a3b8;
      white-space: nowrap;
    }

    .setting-card input[type="time"] {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      color: #f1f5f9;
      font-size: 16px;
      font-weight: 700;
      outline: none;
    }

    .setting-card input[type="time"]:focus {
      border-color: #38bdf8;
    }

    .tab-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
      cursor: pointer;
    }

    .tab.active {
      background: #0c2340;
      border-color: #0ea5e9;
      color: #38bdf8;
      font-weight: 700;
    }

    /* 乗車案内 */
    .recommend-box {
      background: linear-gradient(135deg, #0c3a6e, #0c2340);
      border: 1px solid #1d4ed8;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .recommend-box .label {
      font-size: 11px;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .recommend-box .main-time {
      font-size: 42px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
      line-height: 1;
    }

    .recommend-box .sub-info {
      font-size: 13px;
      color: #93c5fd;
      margin-top: 6px;
    }

    .recommend-box .arr-info {
      font-size: 12px;
      color: #60a5fa;
      margin-top: 4px;
    }

    .no-train-box {
      text-align: center;
      padding: 24px;
      color: #64748b;
      font-size: 14px;
    }

    /* 時刻表リスト */
    .section-title {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    .train-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .train-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 70px 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .train-item.highlight {
      border-color: #0ea5e9;
      background: #0c2340;
    }

    .train-item.passed {
      opacity: 0.4;
    }

    .train-item .dep {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #f1f5f9;
    }

    .train-item.highlight .dep { color: #38bdf8; }

    .train-item .details .type {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .train-item .details .arr {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 9px;
      white-space: nowrap;
    }

    .badge.ok      { background: #15803d; color: #bbf7d0; }
    .badge.tight   { background: #92400e; color: #fde68a; }
    .badge.ng      { background: #7f1d1d; color: #fca5a5; }
    .badge.next    { background: #0ea5e9; color: #fff; }
    .badge.soon    { background: #f59e0b; color: #fff; }
    .badge.passed  { background: #334155; color: #64748b; }
    .badge.minutes { background: #334155; color: #94a3b8; }

    .note {
      font-size: 11px;
      color: #475569;
      text-align: center;
      margin-top: 20px;
      line-height: 1.7;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🚃 富木 → 関空</h1>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="header-sub">JR阪和線 · 関空快速</div>
</header>

<main>
  <!-- 出勤時刻設定 -->
  <div class="setting-card">
    <label>✈ 関空着</label>
    <input type="time" id="arrivalTarget" value="08:00" onchange="render()" />
    <label style="margin-left:auto;font-size:12px;color:#475569">※出勤目標時刻</label>
  </div>

  <!-- 平日/土休日 -->
  <div class="tab-row">
    <div class="tab" id="tab-weekday" onclick="switchTab('weekday')">平日</div>
    <div class="tab" id="tab-holiday" onclick="switchTab('holiday')">土・日・祝</div>
  </div>

  <div id="output"></div>

  <p class="note">
    ※ 時刻はJR西日本 2024年3月ダイヤ改正に基づく参考値です。<br>
    変更の可能性があります。乗車前に公式時刻表でご確認ください。
  </p>
</main>

<script>
// ============================================================
// 富木発 → 関西空港着 時刻表
// JR阪和線 関空快速（富木は一部通過あり。快速停車便のみ掲載）
// 富木 → 日根野 → 関西空港
// 富木〜関空: 約40〜50分
// ============================================================
const TIMETABLE = {
  weekday: [
    // [富木発, 関空着, 種別]
    ['05:31', '06:18', '関空快速'],
    ['06:00', '06:46', '関空快速'],
    ['06:29', '07:17', '関空快速'],
    ['06:57', '07:44', '関空快速'],
    ['07:25', '08:12', '関空快速'],
    ['07:54', '08:41', '関空快速'],
    ['08:22', '09:09', '関空快速'],
    ['08:50', '09:37', '関空快速'],
    ['09:18', '10:05', '関空快速'],
    ['09:48', '10:35', '関空快速'],
    ['10:18', '11:05', '関空快速'],
    ['10:48', '11:35', '関空快速'],
    ['11:18', '12:05', '関空快速'],
    ['11:48', '12:35', '関空快速'],
    ['12:18', '13:05', '関空快速'],
    ['12:48', '13:35', '関空快速'],
    ['13:18', '14:05', '関空快速'],
    ['13:48', '14:35', '関空快速'],
    ['14:18', '15:05', '関空快速'],
    ['14:48', '15:35', '関空快速'],
    ['15:18', '16:05', '関空快速'],
    ['15:48', '16:35', '関空快速'],
    ['16:18', '17:05', '関空快速'],
    ['16:48', '17:35', '関空快速'],
    ['17:18', '18:05', '関空快速'],
    ['17:48', '18:35', '関空快速'],
    ['18:18', '19:05', '関空快速'],
    ['18:48', '19:35', '関空快速'],
    ['19:18', '20:05', '関空快速'],
    ['19:48', '20:35', '関空快速'],
    ['20:18', '21:05', '関空快速'],
    ['20:48', '21:35', '関空快速'],
    ['21:18', '22:05', '関空快速'],
    ['21:48', '22:37', '関空快速'],
    ['22:18', '23:07', '関空快速'],
    ['22:48', '23:36', '関空快速'],
  ],
  holiday: [
    ['05:31', '06:18', '関空快速'],
    ['06:00', '06:46', '関空快速'],
    ['06:29', '07:17', '関空快速'],
    ['06:57', '07:44', '関空快速'],
    ['07:25', '08:12', '関空快速'],
    ['07:57', '08:44', '関空快速'],
    ['08:30', '09:17', '関空快速'],
    ['09:02', '09:49', '関空快速'],
    ['09:32', '10:19', '関空快速'],
    ['10:02', '10:49', '関空快速'],
    ['10:32', '11:19', '関空快速'],
    ['11:02', '11:49', '関空快速'],
    ['11:32', '12:19', '関空快速'],
    ['12:02', '12:49', '関空快速'],
    ['12:32', '13:19', '関空快速'],
    ['13:02', '13:49', '関空快速'],
    ['13:32', '14:19', '関空快速'],
    ['14:02', '14:49', '関空快速'],
    ['14:32', '15:19', '関空快速'],
    ['15:02', '15:49', '関空快速'],
    ['15:32', '16:19', '関空快速'],
    ['16:02', '16:49', '関空快速'],
    ['16:32', '17:19', '関空快速'],
    ['17:02', '17:49', '関空快速'],
    ['17:32', '18:19', '関空快速'],
    ['18:02', '18:49', '関空快速'],
    ['18:32', '19:19', '関空快速'],
    ['19:02', '19:49', '関空快速'],
    ['19:32', '20:19', '関空快速'],
    ['20:02', '20:49', '関空快速'],
    ['20:32', '21:19', '関空快速'],
    ['21:02', '21:49', '関空快速'],
    ['21:32', '22:19', '関空快速'],
    ['22:02', '22:49', '関空快速'],
    ['22:32', '23:19', '関空快速'],
  ]
};

let currentTab = 'weekday';

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-weekday').classList.toggle('active', tab === 'weekday');
  document.getElementById('tab-holiday').classList.toggle('active', tab === 'holiday');
  render();
}

function autoDetectTab() {
  const day = new Date().getDay();
  switchTab(day === 0 || day === 6 ? 'holiday' : 'weekday');
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
}

function render() {
  const target = document.getElementById('arrivalTarget').value || '08:00';
  const targetMin = toMinutes(target);
  const nowMin = nowMinutes();
  const trains = TIMETABLE[currentTab];

  // 出勤に間に合う電車: 関空着 <= 目標時刻
  const inTime = trains.filter(t => toMinutes(t[1]) <= targetMin);
  // その中で最も遅く富木を出発するもの = 推奨電車
  const recommended = inTime.length > 0 ? inTime[inTime.length - 1] : null;

  // 現在時刻から見た次の電車（富木発 >= 今）
  const nextTrains = trains.filter(t => toMinutes(t[0]) >= nowMin);
  const nextTrain = nextTrains[0] || null;

  let html = '';

  // --- 推奨乗車案内 ---
  if (recommended) {
    const depMin = toMinutes(recommended[0]);
    const diffMin = depMin - nowMin;
    const arrMin = toMinutes(recommended[1]);
    const marginMin = targetMin - arrMin;

    let urgency = '';
    if (diffMin < 0) urgency = '（発車済）';
    else if (diffMin === 0) urgency = '【まもなく出発！】';
    else if (diffMin <= 5) urgency = `【あと${diffMin}分！急いで】`;
    else urgency = `（あと${diffMin}分で出発）`;

    html += `
      <div class="recommend-box">
        <div class="label">✅ ${target}までに関空着 — おすすめ電車</div>
        <div class="main-time">${recommended[0]} 富木発</div>
        <div class="sub-info">${recommended[2]} ${urgency}</div>
        <div class="arr-info">
          関空 ${recommended[1]}着 ／ 目標より<strong>${marginMin}分</strong>早着
        </div>
      </div>`;
  } else {
    html += `<div class="no-train-box">⚠ ${target}に間に合う電車が見つかりません</div>`;
  }

  // --- 直近の電車リスト ---
  html += `<div class="section-title">直近の時刻表（富木発）</div>`;
  html += `<div class="train-list">`;

  const showTrains = [
    ...trains.filter(t => toMinutes(t[0]) < nowMin).slice(-2).map(t => ({ ...t, passed: true })),
    ...trains.filter(t => toMinutes(t[0]) >= nowMin).slice(0, 8).map(t => ({ ...t, passed: false })),
  ];

  let firstUpcoming = true;
  for (const t of showTrains) {
    const depMin = toMinutes(t[0]);
    const diff = depMin - nowMin;
    const arrMin = toMinutes(t[1]);
    const isRecommended = recommended && t[0] === recommended[0];

    let badgeClass = '', badgeText = '';
    if (t.passed) {
      badgeClass = 'passed'; badgeText = '発車済';
    } else if (diff <= 0) {
      badgeClass = 'soon'; badgeText = 'まもなく';
    } else if (firstUpcoming) {
      badgeClass = 'next'; badgeText = `次 ${diff}分後`;
      firstUpcoming = false;
    } else if (diff <= 5) {
      badgeClass = 'soon'; badgeText = `${diff}分後`;
    } else {
      badgeClass = 'minutes'; badgeText = `${diff}分後`;
    }

    // 目標時刻との関係
    let targetBadge = '';
    if (!t.passed) {
      if (arrMin <= targetMin) {
        const margin = targetMin - arrMin;
        targetBadge = `<span class="badge ok" style="margin-left:4px">${margin >= 10 ? '余裕あり' : '間に合う'}</span>`;
      } else {
        targetBadge = `<span class="badge ng" style="margin-left:4px">遅延</span>`;
      }
    }

    html += `
      <div class="train-item ${isRecommended ? 'highlight' : ''} ${t.passed ? 'passed' : ''}">
        <div class="dep">${t[0]}</div>
        <div class="details">
          <div class="type">${t[2]} ${targetBadge}</div>
          <div class="arr">関空 ${t[1]}着</div>
        </div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>`;
  }

  html += '</div>';
  document.getElementById('output').innerHTML = html;
}

// Init
autoDetectTab();
setInterval(updateClock, 1000);
setInterval(render, 30000);
updateClock();
</script>
</body>
</html>
