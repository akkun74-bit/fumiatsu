<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富木 → 関空 時刻表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      padding: 14px 20px;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 16px; font-weight: 700; color: #38bdf8; }
    .header-sub { font-size: 11px; color: #64748b; margin-top: 2px; }

    .clock {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #f1f5f9;
    }

    main { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* ── 関空着 入力 ── */
    .arrival-input-card {
      background: #1e293b;
      border: 2px solid #0ea5e9;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .arrival-input-card .label-block { flex: 1; }
    .arrival-input-card .label-block .title {
      font-size: 12px;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .arrival-input-card .label-block .desc {
      font-size: 13px;
      color: #94a3b8;
    }

    input[type="time"] {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      color: #f1f5f9;
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      outline: none;
      width: 130px;
      text-align: center;
    }

    input[type="time"]:focus { border-color: #38bdf8; }

    /* ── 遅延情報 ── */
    .delay-banner {
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.6;
    }

    .delay-banner.ok {
      background: #052e16;
      border: 1px solid #166534;
      color: #86efac;
    }

    .delay-banner.delay {
      background: #431407;
      border: 1px solid #9a3412;
      color: #fdba74;
    }

    .delay-banner.error {
      background: #1e293b;
      border: 1px solid #334155;
      color: #64748b;
    }

    .delay-banner .icon { font-size: 18px; margin-top: 1px; }
    .delay-banner .text strong { display: block; font-size: 14px; margin-bottom: 2px; }
    .delay-updated { font-size: 11px; opacity: 0.6; }

    /* ── 推奨電車 ── */
    .recommend-box {
      background: linear-gradient(135deg, #0c3a6e, #0c2340);
      border: 1px solid #1d4ed8;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .recommend-box .label {
      font-size: 11px;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .recommend-box .row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .recommend-box .dep-time {
      font-size: 52px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
      line-height: 1;
    }

    .recommend-box .dep-label {
      font-size: 16px;
      color: #93c5fd;
      font-weight: 700;
    }

    .recommend-box .sub {
      font-size: 13px;
      color: #93c5fd;
      margin-top: 8px;
    }

    .recommend-box .arr {
      font-size: 12px;
      color: #60a5fa;
      margin-top: 4px;
    }

    .no-train {
      text-align: center;
      padding: 24px;
      color: #64748b;
      font-size: 14px;
      background: #1e293b;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    /* ── タブ ── */
    .tab-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
      cursor: pointer;
    }

    .tab.active {
      background: #0c2340;
      border-color: #0ea5e9;
      color: #38bdf8;
      font-weight: 700;
    }

    /* ── 時刻表リスト ── */
    .section-title {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .train-list { display: flex; flex-direction: column; gap: 8px; }

    .train-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 72px 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .train-item.highlight {
      border-color: #0ea5e9;
      background: #0c2340;
    }

    .train-item.passed { opacity: 0.35; }

    .train-item .dep {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #f1f5f9;
    }

    .train-item.highlight .dep { color: #38bdf8; }

    .details .type { font-size: 13px; font-weight: 600; color: #e2e8f0; }
    .details .arr  { font-size: 11px; color: #64748b; margin-top: 2px; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 9px;
      white-space: nowrap;
    }

    .badge.ok      { background: #15803d; color: #bbf7d0; }
    .badge.ng      { background: #7f1d1d; color: #fca5a5; }
    .badge.next    { background: #0ea5e9; color: #fff; }
    .badge.soon    { background: #f59e0b; color: #fff; }
    .badge.passed  { background: #334155; color: #64748b; }
    .badge.minutes { background: #334155; color: #94a3b8; }

    .note {
      font-size: 11px;
      color: #475569;
      text-align: center;
      margin-top: 20px;
      line-height: 1.7;
    }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🚃 富木 → 関空</h1>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="header-sub">JR阪和線 · 関空快速</div>
</header>

<main>

  <!-- 関空着 入力 -->
  <div class="arrival-input-card">
    <div class="label-block">
      <div class="title">✈ 関空 到着目標</div>
      <div class="desc">何時までに着きたい？</div>
    </div>
    <input type="time" id="arrivalTarget" value="08:00" onchange="render()" />
  </div>

  <!-- 遅延情報 -->
  <div id="delayBanner" class="delay-banner error">
    <span class="icon">🔄</span>
    <div class="text">
      <strong><span class="spinner"></span>運行情報を取得中...</strong>
    </div>
  </div>

  <!-- 推奨電車 -->
  <div id="recommendBox"></div>

  <!-- 平日/土休日 -->
  <div class="tab-row">
    <div class="tab" id="tab-weekday" onclick="switchTab('weekday')">平日</div>
    <div class="tab" id="tab-holiday" onclick="switchTab('holiday')">土・日・祝</div>
  </div>

  <!-- 時刻表 -->
  <div class="section-title">直近の時刻表（富木発）</div>
  <div class="train-list" id="trainList"></div>

  <p class="note">
    ※ 時刻はJR西日本 2024年3月ダイヤ改正に基づく参考値です。<br>
    乗車前に公式時刻表でご確認ください。<br>
    運行情報はJR西日本公式より取得。
  </p>
</main>

<script>
// ============================================================
// 富木発 → 関空着 時刻表（JR阪和線 関空快速）
// ============================================================
const TIMETABLE = {
  weekday: [
    ['05:31','06:18','関空快速'],
    ['06:00','06:46','関空快速'],
    ['06:29','07:17','関空快速'],
    ['06:57','07:44','関空快速'],
    ['07:25','08:12','関空快速'],
    ['07:54','08:41','関空快速'],
    ['08:22','09:09','関空快速'],
    ['08:50','09:37','関空快速'],
    ['09:18','10:05','関空快速'],
    ['09:48','10:35','関空快速'],
    ['10:18','11:05','関空快速'],
    ['10:48','11:35','関空快速'],
    ['11:18','12:05','関空快速'],
    ['11:48','12:35','関空快速'],
    ['12:18','13:05','関空快速'],
    ['12:48','13:35','関空快速'],
    ['13:18','14:05','関空快速'],
    ['13:48','14:35','関空快速'],
    ['14:18','15:05','関空快速'],
    ['14:48','15:35','関空快速'],
    ['15:18','16:05','関空快速'],
    ['15:48','16:35','関空快速'],
    ['16:18','17:05','関空快速'],
    ['16:48','17:35','関空快速'],
    ['17:18','18:05','関空快速'],
    ['17:48','18:35','関空快速'],
    ['18:18','19:05','関空快速'],
    ['18:48','19:35','関空快速'],
    ['19:18','20:05','関空快速'],
    ['19:48','20:35','関空快速'],
    ['20:18','21:05','関空快速'],
    ['20:48','21:35','関空快速'],
    ['21:18','22:05','関空快速'],
    ['21:48','22:37','関空快速'],
    ['22:18','23:07','関空快速'],
    ['22:48','23:36','関空快速'],
  ],
  holiday: [
    ['05:31','06:18','関空快速'],
    ['06:00','06:46','関空快速'],
    ['06:29','07:17','関空快速'],
    ['06:57','07:44','関空快速'],
    ['07:25','08:12','関空快速'],
    ['07:57','08:44','関空快速'],
    ['08:30','09:17','関空快速'],
    ['09:02','09:49','関空快速'],
    ['09:32','10:19','関空快速'],
    ['10:02','10:49','関空快速'],
    ['10:32','11:19','関空快速'],
    ['11:02','11:49','関空快速'],
    ['11:32','12:19','関空快速'],
    ['12:02','12:49','関空快速'],
    ['12:32','13:19','関空快速'],
    ['13:02','13:49','関空快速'],
    ['13:32','14:19','関空快速'],
    ['14:02','14:49','関空快速'],
    ['14:32','15:19','関空快速'],
    ['15:02','15:49','関空快速'],
    ['15:32','16:19','関空快速'],
    ['16:02','16:49','関空快速'],
    ['16:32','17:19','関空快速'],
    ['17:02','17:49','関空快速'],
    ['17:32','18:19','関空快速'],
    ['18:02','18:49','関空快速'],
    ['18:32','19:19','関空快速'],
    ['19:02','19:49','関空快速'],
    ['19:32','20:19','関空快速'],
    ['20:02','20:49','関空快速'],
    ['20:32','21:19','関空快速'],
    ['21:02','21:49','関空快速'],
    ['21:32','22:19','関空快速'],
    ['22:02','22:49','関空快速'],
    ['22:32','23:19','関空快速'],
  ]
};

let currentTab = 'weekday';

function toMin(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function nowMin() {
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}

function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-weekday').classList.toggle('active', tab === 'weekday');
  document.getElementById('tab-holiday').classList.toggle('active', tab === 'holiday');
  render();
}

function autoTab() {
  const d = new Date().getDay();
  switchTab(d === 0 || d === 6 ? 'holiday' : 'weekday');
}

// ── 遅延情報 ──────────────────────────────────────────
// JR西日本 公開運行情報JSON（CORS対応あり）
const DELAY_URL = 'https://trafficinfo.westjr.co.jp/api/v3/trafficinfo.json';
// 阪和線のキーワード
const LINE_KEYWORDS = ['阪和線', '関空快速', '関西空港'];

async function fetchDelay() {
  const banner = document.getElementById('delayBanner');
  try {
    const res = await fetch(DELAY_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const items = data?.operation?.result ?? [];
    const related = items.filter(item => {
      const text = (item.lineName || '') + (item.detail || '') + (item.info || '');
      return LINE_KEYWORDS.some(k => text.includes(k));
    });

    const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

    if (related.length === 0) {
      banner.className = 'delay-banner ok';
      banner.innerHTML = `
        <span class="icon">✅</span>
        <div class="text">
          <strong>阪和線・関空快速 平常運転</strong>
          遅延・運休の情報はありません
          <div class="delay-updated">更新: ${now}</div>
        </div>`;
    } else {
      const msgs = related.map(i => `【${i.lineName}】${i.detail || i.info || ''}`).join('<br>');
      banner.className = 'delay-banner delay';
      banner.innerHTML = `
        <span class="icon">⚠️</span>
        <div class="text">
          <strong>運行情報あり</strong>
          ${msgs}
          <div class="delay-updated">更新: ${now}</div>
        </div>`;
    }
  } catch (e) {
    banner.className = 'delay-banner error';
    banner.innerHTML = `
      <span class="icon">📡</span>
      <div class="text">
        <strong>運行情報を取得できませんでした</strong>
        ネットワークエラーまたはCORS制限
      </div>`;
  }
}

// ── 描画 ──────────────────────────────────────────────
function render() {
  const target = document.getElementById('arrivalTarget').value || '08:00';
  const targetMin = toMin(target);
  const now = nowMin();
  const trains = TIMETABLE[currentTab];

  // 目標時刻に間に合う電車のうち最も遅い出発 = おすすめ
  const inTime = trains.filter(t => toMin(t[1]) <= targetMin);
  const recommended = inTime.length ? inTime[inTime.length - 1] : null;

  // 推奨電車ボックス
  const recBox = document.getElementById('recommendBox');
  if (recommended) {
    const depMin = toMin(recommended[0]);
    const diff = depMin - now;
    let urgency = '';
    if (diff < 0)      urgency = '（発車済）';
    else if (diff === 0) urgency = '【まもなく出発！】';
    else if (diff <= 5) urgency = `【あと${diff}分！急いで】`;
    else               urgency = `（あと${diff}分で出発）`;

    const margin = targetMin - toMin(recommended[1]);

    recBox.innerHTML = `
      <div class="recommend-box">
        <div class="label">✅ 関空 ${target} 着に間に合うおすすめ電車</div>
        <div class="row">
          <div class="dep-time">${recommended[0]}</div>
          <div class="dep-label">富木発</div>
        </div>
        <div class="sub">${recommended[2]} ${urgency}</div>
        <div class="arr">関空 ${recommended[1]}着 ／ 目標より <strong>${margin}分</strong> 早着</div>
      </div>`;
  } else {
    recBox.innerHTML = `<div class="no-train">⚠ ${target} に間に合う電車が見つかりません</div>`;
  }

  // 時刻表リスト
  const showTrains = [
    ...trains.filter(t => toMin(t[0]) < now).slice(-2).map(t => ({ t, passed: true })),
    ...trains.filter(t => toMin(t[0]) >= now).slice(0, 8).map(t => ({ t, passed: false })),
  ];

  let firstUp = true;
  const listHTML = showTrains.map(({ t, passed }) => {
    const depMin = toMin(t[0]);
    const diff = depMin - now;
    const isRec = recommended && t[0] === recommended[0];

    let bClass = '', bText = '';
    if (passed) {
      bClass = 'passed'; bText = '発車済';
    } else if (diff <= 0) {
      bClass = 'soon'; bText = 'まもなく';
    } else if (firstUp) {
      bClass = 'next'; bText = `次 ${diff}分後`;
      firstUp = false;
    } else if (diff <= 5) {
      bClass = 'soon'; bText = `${diff}分後`;
    } else {
      bClass = 'minutes'; bText = `${diff}分後`;
    }

    const arrMin = toMin(t[1]);
    const fitBadge = !passed
      ? (arrMin <= targetMin
          ? `<span class="badge ok" style="margin-left:4px">間に合う</span>`
          : `<span class="badge ng" style="margin-left:4px">遅延NG</span>`)
      : '';

    return `
      <div class="train-item ${isRec ? 'highlight' : ''} ${passed ? 'passed' : ''}">
        <div class="dep">${t[0]}</div>
        <div class="details">
          <div class="type">${t[2]}${fitBadge}</div>
          <div class="arr">関空 ${t[1]}着</div>
        </div>
        <span class="badge ${bClass}">${bText}</span>
      </div>`;
  }).join('');

  document.getElementById('trainList').innerHTML = listHTML;
}

// ── 初期化 ────────────────────────────────────────────
autoTab();
updateClock();
setInterval(updateClock, 1000);
setInterval(render, 30000);       // 30秒ごとに表示更新
setInterval(fetchDelay, 3 * 60 * 1000); // 3分ごとに遅延情報更新
fetchDelay();
</script>
</body>
</html>
